name: Scriora CLA

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CLA or org membership
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "orgs/scriora/members/${ACTOR}" >/dev/null 2>&1; then
            echo "Org member ${ACTOR}: CLA satisfied"
            exit 0
          fi
          if jq -e --arg u "$ACTOR" '.signers[] | select(.github==$u)' .github/cla/signatures.json >/dev/null; then
            echo "Signed CLA: ${ACTOR}"
            exit 0
          fi
          echo "::error::${ACTOR} has not signed CLA.md. Add your login to .github/cla/signatures.json (see CLA.md)."
          exit 1
