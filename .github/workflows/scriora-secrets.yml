name: Scriora secrets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block high-signal secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E '(-----BEGIN (RSA |OPENSSH |EC )?PRIVATE KEY-----)|(AKIA[0-9A-Z]{16})|(sk_live_[0-9a-zA-Z]{10,})|(ghp_[0-9A-Za-z]{20,})' -- ':!.github/workflows/**' ':!docs/**' ':!README.md' ':!CLA.md' ':!CONTRIBUTING.md'; then
            echo "::error::Refusing merge: secret-like material in the tree"
            exit 1
          fi
          echo "Scriora secret scan: no high-signal matches"
