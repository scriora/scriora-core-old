name: Scriora gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: scriora-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect source
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.d.outputs.app }}
      schema: ${{ steps.d.outputs.schema }}
      publish: ${{ steps.d.outputs.publish }}
      compose: ${{ steps.d.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        shell: bash
        run: |
          set -euo pipefail
          has_ts=$(find apps packages src -name '*.ts' -o -name '*.tsx' 2>/dev/null | head -n 1 || true)
          has_schema=$(find . -path './.git' -prune -o -name 'schema.prisma' -print -o -name '*.sql' -print 2>/dev/null | head -n 1 || true)
          has_pub=$(git grep -l -E 'publish_attempts|unknown_external_state' -- ':!.github' ':!docs' ':!README.md' || true)
          has_compose=$(ls deploy/compose.yml deploy/docker-compose.yml docker-compose.yml 2>/dev/null || true)
          echo "app=$([ -n "$has_ts" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "schema=$([ -n "$has_schema" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "publish=$([ -n "$has_pub" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "compose=$([ -n "$has_compose" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm architecture

  tests:
    name: Tests
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  architecture:
    name: Architecture
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm architecture

  migrations:
    name: Migrations
    needs: detect
    if: needs.detect.outputs.schema == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scriora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/scriora
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate

  tenant:
    name: Tenant RLS
    needs: detect
    if: needs.detect.outputs.schema == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scriora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/scriora
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/db

  publish:
    name: Publish ledger
    needs: detect
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scriora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/scriora
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/crypto packages/domain packages/social packages/db

  selfhost:
    name: Self-host
    needs: detect
    if: needs.detect.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Compose contract: web, API, Postgres, Redis, worker."

  supply:
    name: Supply chain
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  coverage:
    name: Coverage
    needs: detect
    if: needs.detect.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
