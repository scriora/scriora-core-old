# Local Classic stack. Redis is not publication authority.
# Copy .env.example to .env before `docker compose up --build`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: scriora
      POSTGRES_DB: scriora
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - scriora-pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:15432:5432"

  migrate:
    build: .
    command: pnpm --filter @scriora/db migrate
    environment:
      DATABASE_URL: postgres://postgres:scriora@postgres:5432/scriora
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: pnpm --filter @scriora/api exec tsx src/main.ts
    environment:
      DATABASE_URL: postgres://postgres:scriora@postgres:5432/scriora
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
      CLASSIC_APP_ORIGIN: http://127.0.0.1:3000
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      LINKEDIN_REDIRECT_URI: ${LINKEDIN_REDIRECT_URI:-http://127.0.0.1:3001/integrations/linkedin/callback}
      MEDIA_ROOT: /data/media
    volumes:
      - scriora-media:/data/media
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 10s
      timeout: 5s
      retries: 8

  worker:
    build: .
    command: pnpm --filter @scriora/worker exec tsx src/main.ts
    environment:
      DATABASE_URL: postgres://postgres:scriora@postgres:5432/scriora
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
      WORKER_POLL_MS: "5000"
      MEDIA_ROOT: /data/media
    volumes:
      - scriora-media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: .
    command: pnpm --filter @scriora/web exec next dev --port 3000 --hostname 0.0.0.0
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  scriora-pg:
  scriora-media:
